<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Country flag game, guess the country by its flag"
    >
    
    <title>FLAG GAME</title>

    <!-- Favicon -->

    <link rel="icon" href="assets/images/favicon.ico" type="image/png" >

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <!-- Custom CSS -->

    <link rel="stylesheet" href="assets/css/style.css" >
  </head>
  <body>

    <!-- Bootstrap 5.3 JS Bundle -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!--Main-->

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="card flag-card shadow-lg text-center p-4">

      <h2 class="fw-bold mb-2"> Guess the Country</h2>

      <div class="mb-2">
        <span class="badge bg-warning text-dark fs-6">
          Time Left: <span id="timer">15</span>s
        </span>
      </div>

      <img id="flag" class="img-fluid border rounded p-3 mb-3 bg-white" alt="image of flag" src="data">

      <input
        id="guessInput"
        class="form-control mb-3 text-center"
        placeholder="Type in the country name..."
      >

    </div>

  </main>

    <!-- Custom JS -->
     
    <script src="assets/js/script.js"></script>

    


</head>
<body>
    
</body>
</html>
