<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Country flag game, guess the country by its flag"
    >
    
    <title>WORLD FLAG GAME</title>

    <!-- Favicon -->

    <link rel="icon" href="assets/images/favicon.ico" type="image/png" >

      <!-- Preconnect for faster flag loading -->
     <link rel="preconnect" href="https://flagcdn.com">


    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- Custom CSS -->

    <link rel="stylesheet" href="assets/style.css" >
  
  </head>

    <!-- Header using Bootstrap -->

     <body class="d-flex flex-column min-vh-100">
      <header class="bg-dark text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-center w-100">🌍 Country Flag Game</h5>
    </div>
  </header>


    <!--Main Flag Game area-->

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="card flag-card shadow-lg text-center p-4">

      <h2 class="fw-bold mb-2"> Guess the Country Flag</h2>

      <div class="mb-2">
        <span class="badge bg-warning text-dark fs-6">
          Time Left: <span id="timer">15</span>s
        </span>
      </div>

      <div id="levelDisplay" class=" fw-bold mb-2">
        <span class="badge bg-info text-dark fs-6">
          Level: <span id="currentLevel">1</span>
        </span>
      </div>

      <img id="flagImg" class="img-fluid border rounded p-3 mb-3 bg-white" alt="image of flag" width="320" height="240" src="data">


      <input
        id="guessInput"
        class="form-control mb-3 text-center"
        placeholder="Type in the country name..." 
        autofocus
        >
<!-- Buttons -->

        <div class="d-flex gap-2 mb-3">
          <button id="submitBtn" class="btn btn-primary flex-fill">Submit</button>
          <button id="nextBtn" class="btn btn-secondary flex-fill">Next</button>
          <button id="playAgainBtn" class="btn btn-warning flex-fill">Play Again</button>
       </div>

       <p id="message" class="fw-semibold"></p>

<div class="text-muted">
  Score: <span id="score" class="fw-bold">0</span>
</div>

<!-- Footer using Bootstrap -->
</div>
  </main>
  <footer class="bg-dark text-white text-center py-3 border-top">
    <p>&copy; 2026 World Flag Game. All rights reserved. Developed by Micheal O Se</p>
  </footer>

    <!-- Custom JS -->
     
    <script src="assets/script.js" defer></script>
    
 
</body>
</html>
